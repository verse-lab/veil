name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # https://github.com/actions/runner-images
      # https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
      matrix:
        include:
        - name: macOS-aarch64
          os: macos-15
        - name: Linux-x86_64
          os: ubuntu-24.04
        # Currently disabled on private repositories:
        # - name: Linux-aarch64
        #   os: ubuntu-24.04-arm
        # We disable Intel Mac CI for now:
        # - name: macOS-x86_64
        #   os: macos-13
    steps:
    # https://github.com/abdoo8080/lean-cvc5/blob/main/.github/workflows/ci.yml#L31
    - name: Install dependencies for cvc5
      if: runner.os == 'Linux'
      run: |
        sudo apt-get install -y clang-15 lld-15 libc++-15-dev libc++abi-15-dev
        sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang-15 100
    - name: Checkout repository
      uses: actions/checkout@v4
    # Suppress Veil's own release fetch, while allowing normal dependency downloads.
    - name: Prepare release build
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      run: mkdir -p .lake/build
    - name: Build and test Veil
      uses: leanprover/lean-action@v1
      with:
        use-github-cache: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
        # Release archives must be packed before building the test driver.
        test: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'false' || 'default' }}
        build-args: '-R -KerrorOnBuild=stale-widget-bundles-run-lake-build-widgetJsAll'
    - name: Check widget bundles were not rewritten
      run: |
        widget_changes=$(git status --porcelain --untracked-files=all -- widget/js)
        if [ -n "$widget_changes" ]; then
          printf '%s\n' "$widget_changes"
          exit 1
        fi
    - name: Pack and check release archive
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      env:
        LAKE_ARTIFACT_CACHE: 'false'
      run: |
        lake pack
        lake clean veil
        lake unpack
        lake --no-cache --no-build build
    - name: Test release build
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      run: lake test
    - name: Test VC manager incrementality through LSP
      run: |
        python3 scripts/tests/test-vc-manager-incrementality.py
        python3 scripts/tests/test-vc-manager-incrementality.py --compact
      timeout-minutes: 10
    - name: Test invariant goal incrementality through LSP
      run: |
        python3 scripts/tests/test-invariant-goal-incrementality.py
        python3 scripts/tests/test-invariant-goal-incrementality.py --deferred
        python3 scripts/tests/test-invariant-goal-incrementality.py --multi-module
        python3 scripts/tests/test-invariant-goal-incrementality.py --multi-module --deferred
      timeout-minutes: 10
    - name: Test temporal proof incrementality through LSP
      run: |
        python3 scripts/tests/test-temporal-proof-incrementality.py
        python3 scripts/tests/test-temporal-proof-incrementality.py --deferred
        python3 scripts/tests/test-temporal-proof-incrementality.py --multi-module
        python3 scripts/tests/test-temporal-proof-incrementality.py --multi-module --deferred
      timeout-minutes: 10
    - name: Test streaming widgets through LSP
      run: python3 scripts/tests/test-streaming-widgets.py
      timeout-minutes: 15
    - name: Build examples
      run: lake build Examples
      timeout-minutes: 30
    - name: Set up Node for widget development checks
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Test widget rendering
      # Node is needed for development checks, not for using Veil.
      # Keep these checks after the build that rejects widget recompilation.
      run: |
        npm ci --prefix widget
        node widget/tests/veilUtils.test.cjs
    - name: Check committed widget bundles
      run: |
        # Keep lake.trace: the guarded Lake build already checked its inputs.
        rm -rf widget/dist
        rm -f widget/js/*.js
        npm run build --prefix widget
        widget_changes=$(git status --porcelain --untracked-files=all -- widget/js)
        if [ -n "$widget_changes" ]; then
          printf '%s\n' "$widget_changes"
          exit 1
        fi
    # Against the Veil of this checkout, built above: this also checks that both report the same IDE protocol
    - name: Test the VS Code extension
      working-directory: editors/vscode
      run: |
        npm ci
        npm test
      timeout-minutes: 20
    - name: Save release archive
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.name }}
        path: .lake/veil-*.tar.gz
        compression-level: 0
        include-hidden-files: true
        if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Download release archives
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release
        merge-multiple: true
    - name: Publish release archives
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
        fi
        gh release upload "$RELEASE_TAG" release/veil-*.tar.gz --clobber
        gh release edit "$RELEASE_TAG" --draft=false

\* Local TLC model for the Apache-2.0 EgalitarianPaxos.tla; see LICENSE.
\* 4 replicas, 1 command, MaxBallot = 1.
\* With 2 or 3 replicas, quorums have 2 replicas, and PrepareFinalize never sends try-pre-accept
\* messages. With 4, quorums have 3 replicas, and it does.
\* Usage: java -jar tla2tools.jar -config R4C1B1.cfg MCEgalitarianPaxos.tla
CONSTANTS
  r1 = r1
  r2 = r2
  r3 = r3
  r4 = r4
  c1 = c1
  c2 = c2
  none = none
  Replicas <- R4
  Commands <- C1
  MaxBallot = 1
  FastQuorums <- MCFastQuorums
  SlowQuorums <- MCSlowQuorums
SPECIFICATION Spec
INVARIANT ConsistencyInv
INVARIANT NontrivialityCmdInv
PROPERTY Stability
\* The spec has no step left once every command is committed and the ballots are used up.
CHECK_DEADLOCK FALSE

\* 3 replicas, 1 command, MaxBallot = 1.
\* Usage: java -jar tla2tools.jar -config R3C1B1.cfg MCEgalitarianPaxos.tla
CONSTANTS
  r1 = r1
  r2 = r2
  r3 = r3
  r4 = r4
  c1 = c1
  c2 = c2
  none = none
  Replicas <- R3
  Commands <- C1
  MaxBallot = 1
  FastQuorums <- MCFastQuorums
  SlowQuorums <- MCSlowQuorums
SPECIFICATION Spec
INVARIANT ConsistencyInv
INVARIANT NontrivialityCmdInv
PROPERTY Stability

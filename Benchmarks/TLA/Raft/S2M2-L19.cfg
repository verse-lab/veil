\* Local TLC model for raft.tla (CC BY 4.0; see its header).
\* 2 servers, MaxClientRequests = 2 (1 client request). Terms stay below 3. The search keeps the
\* states at most 18 steps from the initial state.
\* Usage: java -jar tla2tools.jar -workers 1 -config S2M2-L19.cfg MCDepth.tla
CONSTANT AppendEntriesResponse = AppendEntriesResponse
CONSTANT Follower = Follower
CONSTANT Leader = Leader
CONSTANT Nil = Nil
CONSTANT RequestVoteResponse = RequestVoteResponse
CONSTANT Candidate = Candidate
CONSTANT RequestVoteRequest = RequestVoteRequest
CONSTANT AppendEntriesRequest = AppendEntriesRequest
CONSTANT Server <- S2
CONSTANT MaxClientRequests = 2
CONSTANT MaxLevel = 19
CONSTRAINT TermConstraint
CONSTRAINT DepthBound
SPECIFICATION Spec
INVARIANT NotMoreThanOneLeader
INVARIANT NotCommittedLogDecrease

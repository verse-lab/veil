\* Modified locally: changed finite bounds; omitted temporal-property and deadlock checks.
\*
\* Usage: java -jar tla2tools.jar -config TaskClaiming.cfg TaskClaiming.tla

SPECIFICATION Spec

CONSTANTS
    w1 = w1
    w2 = w2
  Workers = {w1, w2, w3}
    t1 = t1
    t2 = t2
  Tasks = {t1, t2, t3}
  MaxFailures = 3
  MaxLockVersion = 10

CONSTRAINT
    LockVersionBound

INVARIANTS
    TypeOK
    MutualExclusion
    NoDoubleExecution
    DLQOnlyAfterMaxFailures
    LockConsistency
    NoOrphanExecution


CHECK_DEADLOCK FALSE

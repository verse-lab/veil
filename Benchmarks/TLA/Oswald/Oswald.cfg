\* Modified locally: changed finite domains and disabled symmetry reduction.
\* TypeOKBounds, in BenchOswald.tla, is the part of TypeOK that the types of the Veil translation
\* do not ensure.
\* Usage: java -jar tla2tools.jar -config Oswald.cfg BenchOswald.tla
CONSTANTS
    \* Parameters
  Writers = {w1, w2}
  GarbageCollectors = {gc1}
  Values = {A, B, C, D}

    \* Model values
    SNAPSHOT_RECOVERY = SNAPSHOT_RECOVERY
    CATCHUP_RECOVERY = CATCHUP_RECOVERY
    VALIDATE = VALIDATE
    UPDATE_MANIFEST = UPDATE_MANIFEST
    READY = READY
    DELETE = DELETE
    NIL = NIL

SPECIFICATION Spec

\* Uncomment when checking liveness
\* SPECIFICATION LivenessSpec

INVARIANTS
    TypeOKBounds
    ConsistentWriterSnapshots
    ConsistentObservedSnapshots

\* Uncomment when checking liveness
\* PROPERTIES
\*     AllValuesAttempted
\*     WritersReachReady
\*     GcCompletes

CHECK_DEADLOCK FALSE

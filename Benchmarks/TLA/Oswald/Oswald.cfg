CONSTANTS
    \* Parameters
  Writers = {w1, w2}
  GarbageCollectors = {gc1}
  Values = {A, B, C, D}

    \* Model values
    SNAPSHOT_RECOVERY = SNAPSHOT_RECOVERY
    CATCHUP_RECOVERY = CATCHUP_RECOVERY
    VALIDATE = VALIDATE
    UPDATE_MANIFEST = UPDATE_MANIFEST
    READY = READY
    DELETE = DELETE
    NIL = NIL

SPECIFICATION Spec

\* Uncomment when checking liveness
\* SPECIFICATION LivenessSpec

INVARIANTS
    TypeOK
    ConsistentWriterSnapshots
    ConsistentObservedSnapshots

\* Uncomment when checking liveness
\* PROPERTIES
\*     AllValuesAttempted
\*     WritersReachReady
\*     GcCompletes

CHECK_DEADLOCK FALSE

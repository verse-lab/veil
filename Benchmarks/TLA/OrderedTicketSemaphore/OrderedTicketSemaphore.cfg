\* Local safety benchmark: five ordinary clients plus the model's resizer.
\* Underlying model: CC BY 3.0 US; see LICENSE.
\* Usage: java -jar tla2tools.jar -config OrderedTicketSemaphore.cfg MCOrderedTicketSemaphore.tla
SPECIFICATION Spec
CONSTANTS
    InitPermits = 3
    ResizerClientMaxTickets = 2
    ResizeDelta = 3
    Clients = {c1, c2, c3, c4, c5}
CONSTRAINT BenchmarkBound
INVARIANTS
    TypeOK
    TakenNonNegative
    TakenMatchesHolding
    UniqueWaiters
    AwakeBeforeNonAwake

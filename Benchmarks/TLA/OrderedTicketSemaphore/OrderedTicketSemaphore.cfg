\* Local safety benchmark: five ordinary clients plus the model's resizer.
\* Does not check TypeOK, which the types of the Veil translation ensure.
\* ConstrainedNext drops the successors that violate BenchmarkBound, so that TLC checks no
\* invariant in them, like Veil.
\* INIT Init and NEXT ConstrainedNext replace SPECIFICATION Spec.
\* The fairness in Spec does not matter, since the cfg checks no temporal property.
\* Underlying model: CC BY 3.0 US; see LICENSE.
\* Usage: java -jar tla2tools.jar -config OrderedTicketSemaphore.cfg MCOrderedTicketSemaphore.tla
INIT Init
NEXT ConstrainedNext
CONSTANTS
    InitPermits = 3
    ResizerClientMaxTickets = 2
    ResizeDelta = 3
    Clients = {c1, c2, c3, c4, c5}
CONSTRAINT BenchmarkBound
INVARIANTS
    TakenNonNegative
    TakenMatchesHolding
    UniqueWaiters
    AwakeBeforeNonAwake

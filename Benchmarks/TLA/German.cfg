\* German.tla, the model of this configuration, is not included in this repository.
\* Source: https://github.com/egolf-cs/scythe-fmcad2024/blob/acb63604327eaca12e0fae80195124411047f56f/run_tool/sketches/German.tla
\* fetch_upstream.py downloads it next to this file. This configuration is German.cfg of the same
\* commit, with three nodes and three data values instead of two, and without the liveness property.
\* Usage: java -jar tla2tools.jar -config German.cfg German.tla
SPECIFICATION Spec

CONSTANT NODE = {n1,n2,n3}
CONSTANT DATA = {1,2,3}

INVARIANTS CtrlProp DataProp
\* PROPERTIES LivenessExclusive
\* SYMMETRY Symmetry

\* Modified locally: changed MaxOffset and omitted temporal-property checks.
\*
\* Usage: java -jar tla2tools.jar -config LeaderlessLog.cfg LeaderlessLog.tla
\*
\* Sequential compaction: round 1 compacts [1,3], round 2 compacts [4,5].

SPECIFICATION Spec

CONSTANTS
    w1 = w1
    w2 = w2
    Writers = {w1, w2}
  MaxOffset = 13
    CompactRangeStart = 1
    CompactRangeEnd = 3
    CompactRange2Start = 4
    CompactRange2End = 5
  MaxBatch = 2

INVARIANTS
    TypeOK
    MonotonicOffsets
    FencedRejectsAppends
    CompactionPreservesData
    NoPhantomEntries
    CursorConsistency
    NoOverlappingRanges
    NoReaderError
    SequentialCompactionSafety


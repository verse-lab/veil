\* Source: https://github.com/muratdem/RaftLeaderLeases/blob/c773c123bdbbf9aeb18031feddd6b291317faf5e/TLA/mcLeaseGuard.cfg
\* Modified locally: changed finite bounds; disabled symmetry, VIEW and deadlock checking.
\* Does not check TypeOK, which the types of the Veil translation ensure.
\* ConstrainedNext, in BenchLeaseGuard.tla, drops the successors that violate StateConstraint,
\* so that TLC checks no invariant in them, like Veil.
\* Usage: java -jar tla2tools.jar -config LeaseGuard.cfg BenchLeaseGuard.tla
INIT Init
NEXT ConstrainedNext
CONSTANTS
    Server = {n1, n2, n3}
  Key = {k1}
    Follower = Follower
    Leader = Leader
  MaxTerm = 2
  MaxLogLen = 2
  MaxClock = 7
    Delta = 3

CONSTRAINT StateConstraint

INVARIANTS
    EntryIndexes
    OneLeaderPerTerm
    LeaderCompleteness
    StateMachineSafety
    LinearizableReads





CHECK_DEADLOCK FALSE

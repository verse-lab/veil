\* Modified locally: changed finite bounds; disabled symmetry, VIEW and deadlock checking.
\* Usage: java -jar tla2tools.jar -config LeaseGuard.cfg mcLeaseGuard.tla
INIT Init
NEXT Next
CONSTANTS
    Server = {n1, n2, n3}
  Key = {k1}
    Follower = Follower
    Leader = Leader
  MaxTerm = 2
  MaxLogLen = 2
  MaxClock = 7
    Delta = 3

CONSTRAINT StateConstraint

INVARIANTS
    TypeOK
    EntryIndexes
    OneLeaderPerTerm
    LeaderCompleteness
    StateMachineSafety
    LinearizableReads





CHECK_DEADLOCK FALSE

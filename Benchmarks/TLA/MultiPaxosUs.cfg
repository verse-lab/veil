\* MultiPaxosUs.tla, the model of this configuration, is not included in this repository.
\* Source: https://github.com/sachand/HistVar/blob/692e1e5b9c5e89f649af44613b62e557f6b569af/Multi-Paxos/MultiPaxosUs.tla
\* fetch_upstream.py downloads it next to this file, with the TLAPS.tla that it extends.
\* MCMultiPaxosUs.tla bounds its ballots and slots and fixes NewProposals.
\* Usage: java -jar tla2tools.jar -config MultiPaxosUs.cfg MCMultiPaxosUs.tla
SPECIFICATION Spec

CONSTANTS
    Acceptors = {a1, a2, a3}
    Proposers = {p1, p2}
    Values = {v1, v2}
    Quorums = {{a1, a2}, {a1, a3}, {a2, a3}}
    MaxBallot = 2
    MaxSlot = 2
    Ballots <- MCBallots
    Slots <- MCSlots
    NewProposals <- MCNewProposals

INVARIANTS
    \* TypeOK
    Consistency
    

\* Modified locally: changed max_entries and disabled symmetry and ALIAS.
\* Does not check TypeOk, which the types of the Veil translation ensure.
\* ConstrainedNext, in BenchProposerAcceptorStatic.tla, drops the successors that violate
\* StateConstraint, so that TLC checks no invariant in them, like Veil.
\* INIT Init and NEXT ConstrainedNext replace SPECIFICATION Spec.
\* Usage: java -jar tla2tools.jar -config ProposerAcceptorStatic.cfg BenchProposerAcceptorStatic.tla
CONSTANTS
NULL = NULL
proposers = {p1, p2}
acceptors = {a1, a2, a3}
  max_term = 2
  max_entries = 3
INIT Init
NEXT ConstrainedNext
CONSTRAINT StateConstraint
INVARIANT
ElectionSafetyFull
LogIsMonotonic
LogSafety
CommittedNotTruncated

CHECK_DEADLOCK FALSE


